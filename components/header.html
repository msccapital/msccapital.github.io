<style>
  /* ================= HEADER KIỂU HAI HÀNG =================
     Hàng 1: logo, ngày giờ, nút "Đăng ký tư vấn", nút chọn ngôn ngữ.
     Hàng 2: thanh menu rộng hết chiều ngang. */
  header.site .wrap{ max-width:1560px; }

  /* ---- Hàng 1 ---- */
  .hdr-top{ border-bottom:1px solid var(--line); }
  .hdr-top-in{ display:flex; align-items:center; gap:18px; height:80px; }
  .logo{ display:flex; align-items:center; flex:none; }
  .logo-img{ height:60px; width:auto; max-width:100%; display:block; }   /* đổi 60px nếu muốn logo to/nhỏ hơn */
  .hdr-clock{ font-family:var(--font-mono); font-size:13px; color:var(--text-faint); white-space:nowrap; }
  .hdr-sp{ flex:1; }
  .nav-cta{ display:flex; align-items:center; gap:12px; }
  .nav-cta .btn{ white-space:nowrap; }

  /* ---- Nút chọn ngôn ngữ (đứng sau nút Đăng ký tư vấn) ---- */
  .lang-switch{ position:relative; }
  .lang-btn{ width:42px; height:42px; display:inline-flex; align-items:center; justify-content:center; padding:0;
             background:none; color:#fff; border:1px solid var(--line-strong); border-radius:2px; cursor:pointer; }
  .lang-btn:hover, .lang-btn[aria-expanded="true"]{ border-color:var(--green-400); }
  .lang-menu{ position:absolute; right:0; top:calc(100% + 12px); width:250px; max-width:calc(100vw - 32px); z-index:70;
              background:var(--panel-solid); border:1px solid var(--line-strong); box-shadow:0 12px 28px rgba(0,0,0,.5); }
  .lang-menu[hidden]{ display:none; }
  .lang-search{ display:block; width:100%; border:0; border-bottom:1px solid var(--line); border-radius:0; background:transparent; padding:12px 14px; font-size:14px; }
  .lang-list{ max-height:min(60vh, 420px); overflow-y:auto; }
  .lang-list button{ display:block; width:100%; text-align:left; background:none; border:0; color:var(--text-muted);
                     padding:10px 14px; font-size:14px; font-family:var(--font-body); cursor:pointer; border-bottom:1px solid var(--line); }
  .lang-list button:hover{ background:var(--green-900); color:var(--text); }
  .lang-list button.on{ color:var(--green-400); font-weight:600; }

  /* ---- Ẩn thanh/khung của Google Dịch để không đẩy lệch trang ---- */
  body{ top:0 !important; }
  iframe.skiptranslate, .goog-te-banner-frame, #goog-gt-tt, .goog-te-balloon-frame{ display:none !important; }
  .goog-text-highlight{ background:none !important; box-shadow:none !important; }

  /* ---- Hàng 2: thanh menu ---- */
  .hdr-nav{ background:var(--panel-solid); border-bottom:1px solid var(--line); }
  .nav-links{ display:flex; align-items:stretch; gap:0; flex-wrap:nowrap; }
  .nav-links > a,
  .nav-links > .nav-dropdown > a{ display:flex; align-items:center; height:50px; padding:0 18px; font-size:15px; color:var(--text-muted);
                                  white-space:nowrap; border-bottom:2px solid transparent; }
  .nav-links > a:hover,
  .nav-links > .nav-dropdown > a:hover{ color:var(--text); }
  .nav-links a.active, .nav-links a.is-active, .nav-links a.on, .nav-links a.current, .nav-links a[aria-current="page"]{
    background:var(--green-900); color:#fff; border-bottom-color:var(--green-400); }

  /* ---- Menu xổ xuống: rê chuột vào để mở ---- */
  .nav-dropdown{ position:relative; display:flex; }
  .dd-toggle{ gap:6px; }
  .chev{ display:inline-block; width:0; height:0; vertical-align:middle;
         border-left:4px solid transparent; border-right:4px solid transparent; border-top:5px solid currentColor;
         transition:transform .15s ease; }
  .nav-dropdown:hover .chev, .nav-dropdown:focus-within .chev{ transform:rotate(180deg); }
  .nav-dd-menu{ position:absolute; top:100%; left:0; display:none; z-index:60; }
  .nav-dropdown:hover .nav-dd-menu, .nav-dropdown:focus-within .nav-dd-menu{ display:block; }
  .dd-box{ min-width:220px; background:var(--panel-solid); border:1px solid var(--line-strong); border-top:2px solid var(--green-400); box-shadow:0 12px 28px rgba(0,0,0,.45); }
  .nav-links .dd-box a{ display:block; height:auto; padding:12px 18px; border-bottom:1px solid var(--line); font-size:14px; color:var(--text-muted); white-space:nowrap; background:none; }
  .nav-links .dd-box a:last-child{ border-bottom:none; }
  .nav-links .dd-box a:hover{ color:var(--text); background:var(--green-900); }

  .nav-toggle{ display:none; }

  /* ---- Màn hình hẹp (dưới 1100px): dùng nút menu ☰ ---- */
  @media (max-width:1100px){
    .hdr-top-in{ height:72px; }
    .logo-img{ height:50px; }
    .nav-toggle{ display:block; }
    .hdr-nav{ border:0; background:none; }
    .nav-links{ position:fixed; inset:72px 0 auto 0; background:var(--black); border-bottom:1px solid var(--line);
                flex-direction:column; align-items:stretch; padding:8px 24px 20px;
                max-height:calc(100vh - 72px); overflow-y:auto;
                transform:translateY(-8px); opacity:0; pointer-events:none; transition:transform .18s ease, opacity .18s ease; z-index:60; }
    .nav-links.open{ transform:translateY(0); opacity:1; pointer-events:auto; }
    .nav-links > a, .nav-links > .nav-dropdown > a{ height:auto; padding:14px 0; border-bottom:1px solid var(--line); width:100%; }
    .nav-links a.active, .nav-links a.is-active, .nav-links a.on, .nav-links a.current, .nav-links a[aria-current="page"]{ background:none; color:var(--green-400); }
    .nav-dropdown{ display:block; width:100%; }
    .chev{ display:none; }
    .nav-dd-menu{ position:static; display:block; }
    .dd-box{ min-width:0; background:none; border:none; box-shadow:none; }
    .nav-links .dd-box a{ padding:12px 0 12px 18px; }
    .hdr-clock{ display:none; }
  }
  @media (max-width:560px){
    .nav-cta .btn-primary{ display:none; }
  }
</style>

<style>
  /* ---- Kích thước logo & thanh menu ---- */
  header.site .wrap{ max-width:1280px; }                    /* thanh menu rộng hơn nội dung một chút để đủ chỗ cho 9 mục */
  .logo-img{ height:72px; width:auto; max-width:100%; display:block; }   /* đổi số 72px nếu muốn logo to/nhỏ hơn */
  .nav{ height:96px; }
  .nav-links{ gap:16px; }
  .nav-links a{ white-space:nowrap; }

  /* ---- Ô chọn ngôn ngữ ---- */
  .lang-switch select{ width:auto; background:var(--panel-solid); color:var(--text); border:1px solid var(--line-strong);
                       padding:8px 10px; font-size:13.5px; font-family:var(--font-mono); cursor:pointer; }

  /* ---- Ẩn thanh/khung của Google Dịch để không đẩy lệch trang ---- */
  body{ top:0 !important; }
  iframe.skiptranslate, .goog-te-banner-frame, #goog-gt-tt, .goog-te-balloon-frame{ display:none !important; }
  .goog-text-highlight{ background:none !important; box-shadow:none !important; }

  /* ---- Menu xổ xuống (Biểu đồ, Công cụ hỗ trợ): rê chuột vào để mở ---- */
  .nav-dropdown{ position:relative; }
  .dd-toggle{ display:inline-flex; align-items:center; gap:6px; }
  .chev{ display:inline-block; width:0; height:0; vertical-align:middle;
         border-left:4px solid transparent; border-right:4px solid transparent; border-top:5px solid currentColor;
         transition:transform .15s ease; }
  .nav-dropdown:hover .chev, .nav-dropdown:focus-within .chev{ transform:rotate(180deg); }
  .nav-dd-menu{ position:absolute; top:100%; left:-16px; padding-top:14px; display:none; z-index:60; }
  .nav-dropdown:hover .nav-dd-menu, .nav-dropdown:focus-within .nav-dd-menu{ display:block; }
  .dd-box{ min-width:210px; background:var(--panel-solid); border:1px solid var(--line-strong); box-shadow:0 12px 28px rgba(0,0,0,.45); }
  .nav-links .dd-box a{ display:block; padding:12px 18px; border-bottom:1px solid var(--line); font-size:14px; color:var(--text-muted); white-space:nowrap; }
  .nav-links .dd-box a:last-child{ border-bottom:none; }
  .nav-links .dd-box a:hover{ color:var(--text); background:var(--green-900); border-color:var(--line); }

  /* ---- Dưới 1280px: dùng nút menu ☰ để 9 mục không bị chen chúc ---- */
  @media (max-width:1280px){
    .logo-img{ height:60px; }
    .nav{ height:84px; }
    .nav-links{ position:fixed; inset:84px 0 auto 0; background:var(--black); border-bottom:1px solid var(--line);
                flex-direction:column; align-items:flex-start; gap:0; padding:8px 24px 20px;
                max-height:calc(100vh - 84px); overflow-y:auto;
                transform:translateY(-8px); opacity:0; pointer-events:none; transition:transform .18s ease, opacity .18s ease; }
    .nav-links.open{ transform:translateY(0); opacity:1; pointer-events:auto; }
    .nav-links a{ width:100%; padding:12px 0; border-bottom:1px solid var(--line); }
    .nav-toggle{ display:block; }
    .nav-cta .btn-primary{ display:none; }
    .nav-dropdown{ width:100%; }
    .chev{ display:none; }
    .nav-dd-menu{ position:static; display:block; padding:0; }
    .dd-box{ min-width:0; background:none; border:none; box-shadow:none; }
    .nav-links .dd-box a{ padding:12px 0 12px 18px; }
  }
  @media (max-width:900px){
    .logo-img{ height:50px; }
    .nav{ height:76px; }
    .nav-links{ inset:76px 0 auto 0; max-height:calc(100vh - 76px); }
  }
</style>

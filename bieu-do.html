section[id]{ scroll-margin-top: 110px; }
.chart-card{ min-width:0; }
.chart-card h3{ font-size:18px; margin-bottom:12px; }
.chart-box{ border:1px solid var(--line-strong); padding:0; max-width:100%; overflow:hidden; background:var(--black); }
.chart-box .tradingview-widget-copyright{ padding:6px 12px 8px; color:var(--text-faint); }
.chart-box .tradingview-widget-copyright a{ color:var(--green-400); }
.chart-note{ font-size:12.5px; color: var(--text-faint); margin:10px 0 0; max-width:none; }
/* Khung biểu đồ gần vuông: chỉnh aspect-ratio (5/4 -> 1/1 để vuông hẳn) và min-height nếu cần */
.chart-box .tradingview-widget-container{ position:relative; width:100%; height:auto !important; aspect-ratio:5/4; min-height:440px; }
.chart-box .tradingview-widget-container__widget{ position:absolute; top:0; left:0; right:0; bottom:30px; height:auto !important; width:100% !important; }
.chart-box .tradingview-widget-copyright{ position:absolute; left:0; right:0; bottom:0; text-align:center; }
  /* Khung nhận định dưới biểu đồ */
  .market-note{ border:1px solid var(--line-strong); margin-top:28px; background:var(--black); max-width:100%; }
  .market-note-head{ padding:14px 20px; border-bottom:1px solid var(--line-strong); font-family: var(--font-display); font-weight:700; font-size:17px; }
  .market-note-body{ padding:18px 20px 8px; }
  .market-note-body p{ font-size:15px; line-height:1.75; margin:0 0 14px; max-width:none; }
  .market-note-meta{ font-size:12.5px; color: var(--text-faint); padding:0 20px 16px; margin:0; max-width:none; }
/* Ẩn mục không được chọn */
.tab-section[hidden]{ display:none !important; }
</style>
